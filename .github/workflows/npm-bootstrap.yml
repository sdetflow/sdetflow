name: Bootstrap npm Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: insights
        type: choice
        options:
          - playwright
          - ai
          - insights

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use current npm
        run: npm install --global npm@latest

      - name: Read package identity
        id: pkg
        shell: bash
        working-directory: packages/${{ inputs.package }}
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: packages/${{ inputs.package }}

      - name: Test package
        run: npm test
        working-directory: packages/${{ inputs.package }}

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: packages/${{ inputs.package }}

      - name: Check whether this exact version is already public
        id: existing
        shell: bash
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$PKG@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION is already public; publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bootstrap release
        if: steps.existing.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
        working-directory: packages/${{ inputs.package }}

      - name: Verify public registry version with propagation retry
        shell: bash
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -e
          for attempt in {1..30}; do
            found="$(npm view "$PKG@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [[ "$found" == "$VERSION" ]]; then
              echo "Verified public package: $PKG@$found"
              exit 0
            fi
            echo "Registry has not propagated $PKG@$VERSION yet (attempt $attempt/30); waiting 10s..."
            sleep 10
          done
          echo "Package publish may have succeeded, but public registry verification did not complete within 300 seconds."
          exit 1
