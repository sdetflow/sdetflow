name: SDETFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-packages:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        package: [playwright, ai, insights]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: npm pack --dry-run

  java:
    strategy:
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: ./packages/api-java/build.sh

  ruby:
    strategy:
      matrix:
        ruby: ['3.1', '3.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -Ilib test/sdet_flow_test.rb
        working-directory: packages/ruby
      - run: gem build sdet_flow.gemspec
        working-directory: packages/ruby

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-website.py website
