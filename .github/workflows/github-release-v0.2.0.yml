name: Create GitHub v0.2.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.release/github-v0.2.0.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create v0.2.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "GitHub release v0.2.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v0.2.0 \
            --target main \
            --title "SDETFlow v0.2.0" \
            --notes-file docs/releases/v0.2.0.md
